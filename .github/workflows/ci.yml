name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx flake8

      - name: Lint
        run: flake8 .

      - name: Unit tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Train model
        run: python src/train.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            test-results.xml
            models/
            reports/
            mlflow.db

  docker-build:
    needs: build-test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t heart-api:ci .